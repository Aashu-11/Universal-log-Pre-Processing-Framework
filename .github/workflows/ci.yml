name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/fmt.out; test ! -s /tmp/fmt.out
      - run: go test ./... -race -count=1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [control-plane, onboarding]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/${{ matrix.service }}/requirements.txt -r services/${{ matrix.service }}/requirements-dev.txt
      - run: ruff check services/${{ matrix.service }}
      - run: black --check services/${{ matrix.service }}
      - run: cd services/${{ matrix.service }} && python -m pytest -q

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/console/package-lock.json
      - run: cd services/console && npm ci
      - run: cd services/console && npm run lint
      - run: cd services/console && npm run build
