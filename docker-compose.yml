networks:
  ulpf:
    name: ulpf

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  grafana-data:

services:
  # --- Metadata + Hive Metastore backing store -----------------------------
  # postgres:16-alpine — PostgreSQL License. Verified tag exists on Docker Hub.
  postgres:
    image: postgres:16-alpine
    container_name: ulpf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ulpf
      POSTGRES_PASSWORD: ulpf_dev_only
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      # Host-side port only — container-to-container traffic (Presto's meta
      # catalog, Hive Metastore) uses the internal Docker network and the
      # `postgres` service name on 5432, unaffected by this remap. Mapped to
      # 5433 on the host because this dev machine also runs a native Windows
      # PostgreSQL service on 5432 (a pre-existing, unrelated service) that
      # silently wins the port and shadows this container otherwise — every
      # host-side client (`ulpfctl`, control-plane, `psql`) must connect to
      # 5433, not 5432, from outside Docker.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulpf -d ulpf_meta"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ulpf]

  # --- Object store ----------------------------------------------------------
  # minio/minio — AGPL-3.0, free self-hosted. Verified tag exists.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: ulpf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ulpfadmin
      MINIO_ROOT_PASSWORD: ulpf_dev_only
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ulpf]

  minio-init:
    image: minio/mc:latest
    container_name: ulpf-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ulpfadmin ulpf_dev_only &&
      mc mb -p local/ulpf-raw &&
      mc mb -p local/ulpf-lake &&
      mc anonymous set none local/ulpf-raw &&
      mc anonymous set none local/ulpf-lake &&
      echo 'buckets ready'
      "
    networks: [ulpf]

  # --- Stream buffer -----------------------------------------------------
  # apache/kafka — Apache 2.0. KRaft mode, no ZooKeeper. Verified tag exists.
  kafka:
    image: apache/kafka:3.7.0
    container_name: ulpf-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ulpf-kraft-cluster-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ulpf]

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: ulpf-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ulpf.raw.refs --partitions 6 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ulpf.events.normalized --partitions 6 --replication-factor 1 --config retention.ms=1800000 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ulpf.dlq --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ulpf.control.parsers --partitions 1 --replication-factor 1 --config retention.ms=-1 --config cleanup.policy=compact &&
      echo 'topics ready'
      "
    networks: [ulpf]

  # --- Hive standalone metastore, Postgres-backed, S3A -> MinIO -----------
  # apache/hive — Apache 2.0. Verified tag exists; supports SERVICE_NAME=metastore.
  hive-metastore:
    build: ./deploy/hive
    image: ulpf/hive-metastore:4.0.0
    container_name: ulpf-hive-metastore
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=ulpf
        -Djavax.jdo.option.ConnectionPassword=ulpf_dev_only
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.access.key=ulpfadmin
        -Dfs.s3a.secret.key=ulpf_dev_only
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.connection.ssl.enabled=false
    volumes:
      - ./deploy/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    ports:
      - "9083:9083"
    healthcheck:
      # netstat/ss/nc aren't in this image; bash's /dev/tcp pseudo-device is
      # a portable enough TCP-connect check without adding another package.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [ulpf]

  # --- PrestoDB coordinator (single node for the prototype) ---------------
  # prestodb/presto — Apache 2.0. Verified tag exists.
  presto-coordinator:
    image: prestodb/presto:0.286
    container_name: ulpf-presto
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      # NOT read-only: prestodb/presto's own entrypoint.sh writes into etc/
      # at startup (observed: it fails hard on a read-only mount trying to
      # touch node.properties) — our config files still take effect, the
      # container just also needs to be able to add to them.
      - ./deploy/presto/etc:/opt/presto-server/etc
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [ulpf]

  # --- Observability --------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ulpf-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ulpf]

  grafana:
    image: grafana/grafana:10.4.1
    container_name: ulpf-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ulpf_dev_only
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ulpf]

  # --- ULPF's own application layer --------------------------------------
  # Everything above this line is infrastructure. These six services are
  # ULPF's own code, containerized — collector/processor read parser packs,
  # dictionaries and enrichment data as mounted volumes (not baked into the
  # image) so a parser publish (Phase 7) or `ulpfctl gen-enrichment` run is
  # visible without an image rebuild, matching CLAUDE.md's "parsers are
  # data, not code" rule.
  ulpf-collector:
    build:
      context: .
      dockerfile: ./deploy/go/Dockerfile
    image: ulpf/go:latest
    container_name: ulpf-collector
    restart: unless-stopped
    command: ["/app/ulpf-collector"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ulpfadmin
      MINIO_SECRET_KEY: ulpf_dev_only
      MINIO_RAW_BUCKET: ulpf-raw
      MINIO_USE_SSL: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_RAW_REFS: ulpf.raw.refs
      ULPF_NODE_ID: collector-1
      ULPF_VAULT_SEGMENT_MAX_BYTES: "67108864"
      # 60s, not the 300s (5min) production default — a showcase/demo build
      # should surface data in the lake within about a minute of sending
      # traffic, not require watching a spinner for five. Raise this back to
      # 300s (or higher) for anything beyond a live demo.
      ULPF_VAULT_SEGMENT_MAX_SECONDS: "60"
    ports:
      - "5514:5514/udp"
      - "6601:6601"
      - "8088:8088"
      - "9100:9100"
    networks: [ulpf]

  ulpf-processor:
    build:
      context: .
      dockerfile: ./deploy/go/Dockerfile
    image: ulpf/go:latest
    container_name: ulpf-processor
    restart: unless-stopped
    command: ["/app/ulpf-processor"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ulpfadmin
      MINIO_SECRET_KEY: ulpf_dev_only
      MINIO_RAW_BUCKET: ulpf-raw
      MINIO_LAKE_BUCKET: ulpf-lake
      MINIO_USE_SSL: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_RAW_REFS: ulpf.raw.refs
      KAFKA_TOPIC_NORMALIZED: ulpf.events.normalized
      KAFKA_TOPIC_DLQ: ulpf.dlq
      ULPF_NODE_ID: processor-1
      ULPF_PACKS_DIR: /app/packs
      ULPF_DICTIONARIES_DIR: /app/config/dictionaries
      ULPF_ENRICHMENT_DIR: /app/enrichment
    volumes:
      - ./packs:/app/packs:ro
      - ./config:/app/config:ro
      - ./enrichment:/app/enrichment:ro
    ports:
      - "9101:9101"
    networks: [ulpf]

  control-plane:
    build:
      context: .
      dockerfile: ./deploy/control-plane/Dockerfile
    image: ulpf/control-plane:latest
    container_name: ulpf-control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ULPF_DB_URL: postgresql+psycopg2://ulpf:ulpf_dev_only@postgres:5432/ulpf_meta
      ULPF_JWT_SECRET: change_me_dev_only
      ULPF_PRESTO_HOST: presto-coordinator
      ULPF_PRESTO_PORT: "8080"
      ULPF_KAFKA_BROKERS: kafka:9092
      ULPF_MINIO_ENDPOINT: minio:9000
      ULPF_MINIO_ACCESS_KEY: ulpfadmin
      ULPF_MINIO_SECRET_KEY: ulpf_dev_only
      ULPF_MINIO_RAW_BUCKET: ulpf-raw
      ULPF_REPO_ROOT: /app
      ULPF_COLLECTOR_METRICS_URL: http://ulpf-collector:9100/metrics
      ULPF_PROCESSOR_METRICS_URL: http://ulpf-processor:9101/metrics
    volumes:
      - ./packs:/app/packs
      - ./testdata:/app/testdata:ro
    ports:
      - "8000:8000"
    healthcheck:
      # python:3.11-slim has neither curl nor wget; urllib is stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [ulpf]

  ulpf-dlq-bridge:
    build:
      context: .
      dockerfile: ./deploy/go/Dockerfile
    image: ulpf/go:latest
    container_name: ulpf-dlq-bridge
    restart: unless-stopped
    command: ["/app/ulpf-dlq-bridge"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      control-plane:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_DLQ: ulpf.dlq
      ULPF_CONTROL_PLANE_URL: http://control-plane:8000
    networks: [ulpf]

  onboarding:
    build:
      context: .
      dockerfile: ./deploy/onboarding/Dockerfile
    image: ulpf/onboarding:latest
    container_name: ulpf-onboarding
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      ULPF_CONTROL_PLANE_URL: http://control-plane:8000
      ULPF_REPO_ROOT: /app
    volumes:
      - ./packs:/app/packs
    ports:
      - "8001:8001"
    networks: [ulpf]

  console:
    build:
      context: .
      dockerfile: ./deploy/console/Dockerfile
    image: ulpf/console:latest
    container_name: ulpf-console
    restart: unless-stopped
    depends_on:
      - control-plane
      - onboarding
    ports:
      - "5173:5173"
    networks: [ulpf]
