networks:
  logkrama:
    name: logkrama

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  grafana-data:
  ollama-data:

services:
  # --- Metadata + Hive Metastore backing store -----------------------------
  # postgres:16-alpine — PostgreSQL License. Verified tag exists on Docker Hub.
  postgres:
    image: postgres:16-alpine
    container_name: logkrama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logkrama
      POSTGRES_PASSWORD: logkrama_dev_only
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      # Host-side port only — container-to-container traffic (Presto's meta
      # catalog, Hive Metastore) uses the internal Docker network and the
      # `postgres` service name on 5432, unaffected by this remap. Mapped to
      # 5433 on the host because this dev machine also runs a native Windows
      # PostgreSQL service on 5432 (a pre-existing, unrelated service) that
      # silently wins the port and shadows this container otherwise — every
      # host-side client (`logkramactl`, control-plane, `psql`) must connect to
      # 5433, not 5432, from outside Docker.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logkrama -d logkrama_meta"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [logkrama]

  # --- Object store ----------------------------------------------------------
  # minio/minio — AGPL-3.0, free self-hosted. Verified tag exists.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: logkrama-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: logkramaadmin
      MINIO_ROOT_PASSWORD: logkrama_dev_only
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [logkrama]

  minio-init:
    image: minio/mc:latest
    container_name: logkrama-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 logkramaadmin logkrama_dev_only &&
      mc mb -p local/logkrama-raw &&
      mc mb -p local/logkrama-lake &&
      mc anonymous set none local/logkrama-raw &&
      mc anonymous set none local/logkrama-lake &&
      echo 'buckets ready'
      "
    networks: [logkrama]

  # --- Stream buffer -----------------------------------------------------
  # apache/kafka — Apache 2.0. KRaft mode, no ZooKeeper. Verified tag exists.
  kafka:
    image: apache/kafka:3.7.0
    container_name: logkrama-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: logkrama-kraft-cluster-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [logkrama]

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: logkrama-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic logkrama.raw.refs --partitions 6 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic logkrama.events.normalized --partitions 6 --replication-factor 1 --config retention.ms=1800000 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic logkrama.dlq --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic logkrama.control.parsers --partitions 1 --replication-factor 1 --config retention.ms=-1 --config cleanup.policy=compact &&
      echo 'topics ready'
      "
    networks: [logkrama]

  # --- Hive standalone metastore, Postgres-backed, S3A -> MinIO -----------
  # apache/hive — Apache 2.0. Verified tag exists; supports SERVICE_NAME=metastore.
  hive-metastore:
    build: ./deploy/hive
    image: logkrama/hive-metastore:4.0.0
    container_name: logkrama-hive-metastore
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # This volume already has Hive's metastore schema. The Hive image reads
      # IS_RESUME to skip initialization; re-running it causes duplicate-table
      # errors after the LogKrama rename.
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=logkrama
        -Djavax.jdo.option.ConnectionPassword=logkrama_dev_only
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.access.key=logkramaadmin
        -Dfs.s3a.secret.key=logkrama_dev_only
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.connection.ssl.enabled=false
    volumes:
      - ./deploy/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    ports:
      - "9083:9083"
    healthcheck:
      # netstat/ss/nc aren't in this image; bash's /dev/tcp pseudo-device is
      # a portable enough TCP-connect check without adding another package.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [logkrama]

  # --- PrestoDB coordinator (single node for the prototype) ---------------
  # prestodb/presto — Apache 2.0. Verified tag exists.
  presto-coordinator:
    image: prestodb/presto:0.286
    container_name: logkrama-presto
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      # NOT read-only: prestodb/presto's own entrypoint.sh writes into etc/
      # at startup (observed: it fails hard on a read-only mount trying to
      # touch node.properties) — our config files still take effect, the
      # container just also needs to be able to add to them.
      - ./deploy/presto/etc:/opt/presto-server/etc
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [logkrama]

  # --- Observability --------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: logkrama-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logkrama]

  grafana:
    image: grafana/grafana:10.4.1
    container_name: logkrama-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: logkrama_dev_only
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logkrama]

  # --- Local LLM runtime, optional (Investigation Assistant) ---------------
  # ollama/ollama — MIT, no account/signup, runs fully locally once a model
  # is pulled. The control plane's assistant.py already returns a real
  # deterministic (non-LLM) analysis whenever LOGKRAMA_OLLAMA_URL is unset
  # or this service is unreachable, so it stays a genuinely optional
  # enhancement, not a hard dependency — air-gapped operation is unaffected
  # if this is never started.
  ollama:
    image: ollama/ollama:latest
    container_name: logkrama-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      # The official image has neither wget nor curl — use the bundled CLI,
      # which talks to the same local API, instead of an HTTP probe.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [logkrama]

  # One-shot: pulls the model once (cached in ollama-data afterward, so this
  # is a no-op on every later `docker compose up`). Not on control-plane's
  # depends_on — the first pull can take a while and the assistant already
  # degrades gracefully, so app startup is never blocked waiting on it.
  ollama-init:
    image: ollama/ollama:latest
    container_name: logkrama-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "OLLAMA_HOST=ollama:11434 ollama pull gemma3:1b && echo 'gemma3:1b ready'"
    networks: [logkrama]

  # --- LOGKRAMA's own application layer --------------------------------------
  # Everything above this line is infrastructure. These seven services are
  # LOGKRAMA's own code, containerized — collector/processor read parser packs,
  # dictionaries and enrichment data as mounted volumes (not baked into the
  # image) so a parser publish (Phase 7) or `logkramactl gen-enrichment` run is
  # visible without an image rebuild, matching CLAUDE.md's "parsers are
  # data, not code" rule.
  logkrama-collector:
    build:
      context: .
      dockerfile: ./deploy/go/Dockerfile
    image: logkrama/go:latest
    container_name: logkrama-collector
    restart: unless-stopped
    command: ["/app/logkrama-collector"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: logkramaadmin
      MINIO_SECRET_KEY: logkrama_dev_only
      MINIO_RAW_BUCKET: logkrama-raw
      MINIO_USE_SSL: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_RAW_REFS: logkrama.raw.refs
      LOGKRAMA_NODE_ID: collector-1
      LOGKRAMA_VAULT_SEGMENT_MAX_BYTES: "67108864"
      # 60s, not the 300s (5min) production default — a showcase/demo build
      # should surface data in the lake within about a minute of sending
      # traffic, not require watching a spinner for five. Raise this back to
      # 300s (or higher) for anything beyond a live demo.
      LOGKRAMA_VAULT_SEGMENT_MAX_SECONDS: "60"
    ports:
      - "5514:5514/udp"
      - "6601:6601"
      - "8088:8088"
      - "9100:9100"
    networks: [logkrama]

  logkrama-processor:
    build:
      context: .
      dockerfile: ./deploy/go/Dockerfile
    image: logkrama/go:latest
    container_name: logkrama-processor
    restart: unless-stopped
    command: ["/app/logkrama-processor"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: logkramaadmin
      MINIO_SECRET_KEY: logkrama_dev_only
      MINIO_RAW_BUCKET: logkrama-raw
      MINIO_LAKE_BUCKET: logkrama-lake
      MINIO_USE_SSL: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_RAW_REFS: logkrama.raw.refs
      KAFKA_TOPIC_NORMALIZED: logkrama.events.normalized
      KAFKA_TOPIC_DLQ: logkrama.dlq
      LOGKRAMA_NODE_ID: processor-1
      LOGKRAMA_PACKS_DIR: /app/packs
      LOGKRAMA_DICTIONARIES_DIR: /app/config/dictionaries
      LOGKRAMA_ENRICHMENT_DIR: /app/enrichment
    volumes:
      - ./packs:/app/packs:ro
      - ./config:/app/config:ro
      - ./enrichment:/app/enrichment:ro
    ports:
      - "9101:9101"
    networks: [logkrama]

  control-plane:
    build:
      context: .
      dockerfile: ./deploy/control-plane/Dockerfile
    image: logkrama/control-plane:latest
    container_name: logkrama-control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      LOGKRAMA_DB_URL: postgresql+psycopg2://logkrama:logkrama_dev_only@postgres:5432/logkrama_meta
      LOGKRAMA_JWT_SECRET: change_me_dev_only
      LOGKRAMA_PRESTO_HOST: presto-coordinator
      LOGKRAMA_PRESTO_PORT: "8080"
      LOGKRAMA_KAFKA_BROKERS: kafka:9092
      LOGKRAMA_MINIO_ENDPOINT: minio:9000
      LOGKRAMA_MINIO_ACCESS_KEY: logkramaadmin
      LOGKRAMA_MINIO_SECRET_KEY: logkrama_dev_only
      LOGKRAMA_MINIO_RAW_BUCKET: logkrama-raw
      LOGKRAMA_REPO_ROOT: /app
      LOGKRAMA_COLLECTOR_METRICS_URL: http://logkrama-collector:9100/metrics
      LOGKRAMA_PROCESSOR_METRICS_URL: http://logkrama-processor:9101/metrics
      # Points at the host's native Ollama install (not the ollama/ollama-init
      # compose services below, which are unused while a native install is
      # active) — host.docker.internal reaches the Windows/Mac host from
      # inside a container. On native Linux Docker, replace with the host's
      # actual LAN/bridge IP.
      LOGKRAMA_OLLAMA_URL: http://host.docker.internal:11434
      LOGKRAMA_OLLAMA_MODEL: gemma3:1b
    volumes:
      - ./packs:/app/packs
      - ./testdata:/app/testdata:ro
    ports:
      - "8000:8000"
    healthcheck:
      # python:3.11-slim has neither curl nor wget; urllib is stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [logkrama]

  logkrama-dlq-bridge:
    build:
      context: .
      dockerfile: ./deploy/go/Dockerfile
    image: logkrama/go:latest
    container_name: logkrama-dlq-bridge
    restart: unless-stopped
    command: ["/app/logkrama-dlq-bridge"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      control-plane:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_DLQ: logkrama.dlq
      LOGKRAMA_CONTROL_PLANE_URL: http://control-plane:8000
    networks: [logkrama]

  # Keeps Presto's view of the vault/lake current without a human running
  # `logkramactl vault export-index` + `partitions sync` by hand. Found live
  # (2026-09-28): after the ULPF->LOGKRAMA rename, nobody had re-run these,
  # so vault.logkrama.raw_segments silently had zero rows and every
  # Traceability click failed with a real "segment not found" error even
  # though fresh data existed — see docs/DECISIONS.md. Runs both commands
  # immediately on start (the loop body executes before its first sleep),
  # then every 5 minutes; a failed cycle logs and retries next cycle rather
  # than crashing the container.
  vault-index-sync:
    image: logkrama/go:latest
    container_name: logkrama-vault-index-sync
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
      presto-coordinator:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: logkramaadmin
      MINIO_SECRET_KEY: logkrama_dev_only
      MINIO_RAW_BUCKET: logkrama-raw
      MINIO_USE_SSL: "false"
      PRESTO_URL: "http://logkrama@presto-coordinator:8080?catalog=lake&schema=logkrama"
    entrypoint: ["/bin/sh", "-c"]
    # $$ throughout: docker compose interpolates bare $VAR in the compose
    # file itself before the container ever sees it (confirmed live — the
    # first deploy silently blanked every $VAR here, logged as compose
    # warnings, and --from/--to got empty strings). $$ survives compose's
    # own substitution pass and reaches the container's /bin/sh as a plain
    # single $, which then expands normally at runtime.
    command:
      - |
        while true; do
          TODAY=$$(date -u +%Y-%m-%d)
          YDAY=$$(date -u -d "@$$(($$(date -u +%s) - 86400))" +%Y-%m-%d)
          echo "vault-index-sync: exporting segment index $$YDAY..$$TODAY"
          /app/logkramactl vault export-index --from "$$YDAY" --to "$$TODAY" || echo "vault-index-sync: export-index failed, retrying next cycle"
          echo "vault-index-sync: syncing partitions"
          /app/logkramactl partitions sync --presto-url "$$PRESTO_URL" || echo "vault-index-sync: partitions sync failed, retrying next cycle"
          sleep 300
        done
    networks: [logkrama]

  onboarding:
    build:
      context: .
      dockerfile: ./deploy/onboarding/Dockerfile
    image: logkrama/onboarding:latest
    container_name: logkrama-onboarding
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      LOGKRAMA_CONTROL_PLANE_URL: http://control-plane:8000
      LOGKRAMA_REPO_ROOT: /app
    volumes:
      - ./packs:/app/packs
    ports:
      - "8001:8001"
    networks: [logkrama]

  console:
    build:
      context: .
      dockerfile: ./deploy/console/Dockerfile
    image: logkrama/console:latest
    container_name: logkrama-console
    restart: unless-stopped
    depends_on:
      - control-plane
      - onboarding
    ports:
      - "5173:5173"
    networks: [logkrama]
