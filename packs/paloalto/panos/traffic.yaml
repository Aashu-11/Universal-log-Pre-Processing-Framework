# Palo Alto Networks PAN-OS TRAFFIC log parser.
# Wire shape (syslog RFC3164 header + CSV body), generated by
# tools/loggen's paloAltoTraffic() and matched exactly here — see the
# column comment in tools/loggen/vendors.go for the field-by-field mapping.
metadata:
  id: paloalto.panos.traffic
  version: "1.0.0"
  vendor: paloalto
  product: panos
  observer_type: firewall
  event_class: traffic

match:
  priority: 100
  confidence: 0.95
  all:
    - contains: ",TRAFFIC,"
  any:
    - contains: "pa-edge"
    - regex: '\d+,\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2},\d+,TRAFFIC,'

pipeline:
  - op: syslog

  - op: csv
    field: message
    delimiter: ","
    columns:
      - "_"                # PAN-OS content-type marker ("1")
      - receive_time
      - serial
      - log_type
      - log_subtype
      - src
      - dst
      - rule
      - app
      - from_zone
      - to_zone
      - session_id
      - src_port
      - dst_port
      - protocol
      - action
      - bytes_sent
      - bytes_received
      - packets
      - elapsed_time
      - device_name

  - op: convert
    field: session_id
    type: int
  - op: convert
    field: src_port
    type: int
  - op: convert
    field: dst_port
    type: int
  - op: convert
    field: bytes_sent
    type: int
  - op: convert
    field: bytes_received
    type: int
  - op: convert
    field: packets
    type: int
  - op: convert
    field: elapsed_time
    type: int

  - op: date
    field: receive_time
    as: receive_time_epoch_ns
    formats:
      - "2006/01/02 15:04:05"

on_failure: emit_partial
