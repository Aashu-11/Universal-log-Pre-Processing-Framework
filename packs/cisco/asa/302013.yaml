# Cisco ASA %ASA-6-302013 ("Built ... connection") parser.
# Wire shape generated by tools/loggen's ciscoASA302013(). Note ASA's
# syslog header includes a 4-digit year ("Sep 07 2026 14:02:11"), which is
# not strict RFC3164 — internal/parse/ops's syslog operator detects and
# handles this vendor deviation explicitly.
metadata:
  id: cisco.asa.302013
  version: "1.0.0"
  vendor: cisco
  product: asa
  observer_type: firewall
  event_class: connection_built

match:
  priority: 100
  confidence: 0.95
  all:
    - contains: "%ASA-6-302013"

pipeline:
  - op: syslog

  - op: grok
    field: message
    pattern: >-
      %ASA-6-%{INT:signature_id}: Built %{WORD:direction} %{WORD:protocol}
      connection %{INT:conn_id} for %{WORD:src_zone}:%{IP:src_ip}/%{INT:src_port}
      \(%{IP}/%{INT}\) to %{WORD:dst_zone}:%{IP:dst_ip}/%{INT:dst_port} \(%{IP}/%{INT}\)

  - op: convert
    field: signature_id
    type: int
  - op: convert
    field: conn_id
    type: int
  - op: convert
    field: src_port
    type: int
  - op: convert
    field: dst_port
    type: int

on_failure: emit_partial
