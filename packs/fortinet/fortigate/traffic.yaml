# Fortinet FortiGate traffic log parser (key=value body, no CSV framing).
# Wire shape generated by tools/loggen's fortinetTraffic().
metadata:
  id: fortinet.fortigate.traffic
  version: "1.0.0"
  vendor: fortinet
  product: fortigate
  observer_type: firewall
  event_class: traffic

match:
  priority: 100
  confidence: 0.95
  all:
    - contains: "srcip="
  any:
    - contains: 'type="traffic"'
    - contains: 'devname='

pipeline:
  # FortiGate's body is space-delimited key="value" pairs straight after
  # the PRI — not RFC3164 shaped (no "hostname tag:" segment) — so we strip
  # PRI with a small regex rather than running the generic "syslog" op,
  # which would otherwise misparse the leading kv pairs as a fake
  # timestamp/hostname.
  - op: regex
    pattern: '^<(?P<syslog_pri>\d+)>(?P<body>.*)$'

  - op: kv
    field: body
    pair_sep: " "
    kv_sep: "="

  - op: convert
    field: srcport
    type: int
  - op: convert
    field: dstport
    type: int
  - op: convert
    field: policyid
    type: int
  - op: convert
    field: sentbyte
    type: int
  - op: convert
    field: rcvdbyte
    type: int
  - op: convert
    field: duration
    type: int
  - op: convert
    field: eventtime
    type: int

on_failure: emit_partial
