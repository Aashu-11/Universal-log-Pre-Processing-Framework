global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ulpf-collector
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: ulpf-processor
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: control-plane
    static_configs:
      - targets: ["host.docker.internal:9102"]
  - job_name: presto
    metrics_path: /v1/jmx/mbean
    static_configs:
      - targets: ["presto-coordinator:8080"]
