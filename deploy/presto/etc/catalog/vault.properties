# Raw Vault segment index (segment_id, offsets, hashes, merkle roots) as
# Parquet on MinIO. Separate Hive schema ("vault") from the "lake" schema so
# the two catalogs can evolve independently even though both use the hive
# connector against the same metastore.
connector.name=hive-hadoop2
hive.metastore.uri=thrift://hive-metastore:9083

hive.s3.endpoint=http://minio:9000
hive.s3.path-style-access=true
hive.s3.aws-access-key=ulpfadmin
hive.s3.aws-secret-key=ulpf_dev_only
hive.s3.ssl.enabled=false

hive.non-managed-table-writes-enabled=true
hive.allow-drop-table=true
hive.allow-rename-table=true
hive.parquet.use-column-names=true
hive.storage-format=PARQUET
