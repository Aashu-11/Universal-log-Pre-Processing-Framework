# Live tier: the last N minutes of normalized events, queryable in SQL
# straight off the logkrama.events.normalized Kafka topic. Kept short-retention
# (30 min, set on the topic in docker-compose.yml) so this stays a genuine
# hot tier and full-topic scans stay cheap — see CLAUDE.md Section E.
connector.name=kafka
kafka.nodes=kafka:9092
kafka.table-description-dir=/opt/presto-server/etc/kafka
kafka.hide-internal-columns=false
kafka.default-schema=logkrama
# PrestoDB 0.286's kafka connector (unlike Trino's later fork) does NOT
# auto-discover tables from kafka.table-description-dir alone — it only
# builds column metadata for tables also named here. Found live: the
# connector loaded with zero warnings/errors and "kafka.table-names []"
# logged at startup, so every query against stream.logkrama.* failed with
# "Schema logkrama does not exist" even though the topic and the JSON
# description file were both genuinely correct — see docs/DECISIONS.md.
kafka.table-names=logkrama.events_normalized
