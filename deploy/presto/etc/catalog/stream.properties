# Live tier: the last N minutes of normalized events, queryable in SQL
# straight off the ulpf.events.normalized Kafka topic. Kept short-retention
# (30 min, set on the topic in docker-compose.yml) so this stays a genuine
# hot tier and full-topic scans stay cheap — see CLAUDE.md Section E.
connector.name=kafka
kafka.nodes=kafka:9092
kafka.table-description-dir=/opt/presto-server/etc/kafka
kafka.hide-internal-columns=false
kafka.default-schema=ulpf
